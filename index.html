<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rude Boy Racing — Coming Soon</title>
<meta name="description" content="Rude Boy Racing — GT3/4-inspired aerodynamic components for the BMW F8x platform. Engineered, not copied. Data shown. Fitment guaranteed.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600;1,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0b0b0c;
    --graphite:#17181a;
    --graphite-2:#202226;
    --paper:#eeece6;
    --paper-dim:#a9a7a0;
    --flag:#ff3d1f;
    --flag-dim:#7a2314;
    --line:#33353a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* topographic contour map, lowkey, sitting behind everything */
  .topo{
    position:fixed;
    inset:0;
    z-index:0;
    width:100%;
    height:100%;
  }
  .topo{ opacity:0.65; }

  /* ambient warm glow behind the mark */
  .field{
    position:fixed;
    inset:0;
    z-index:0;
    background: radial-gradient(ellipse 60% 40% at 50% 38%, rgba(255,61,31,0.16), transparent 60%);
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ background-position: 0 0; }
    100%{ background-position: 40px -30px; }
  }

  .wrap{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw 6vh;
    text-align:center;
  }

  .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(1.05rem, 1.9vw, 1.3rem);
    letter-spacing:.04em;
    color:var(--paper-dim);
    margin:0 0 2.3rem;
    display:flex;
    align-items:center;
    gap:.9em;
  }
  .eyebrow::before,.eyebrow::after{
    content:'';
    width:32px;height:1px;
    background:var(--line);
  }

  .mark{
    width:min(150px, 24vw);
    height:auto;
    color:var(--paper);
    filter:drop-shadow(0 0 36px rgba(255,61,31,0.25));
    margin-bottom:1.8rem;
  }
  .mark path{ fill:currentColor; }

  h1.word{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:clamp(2.2rem, 6.4vw, 4.2rem);
    letter-spacing:.03em;
    line-height:1.15;
    margin:0 0 1.2rem;
  }
  h1.word .accent{
    color:var(--flag);
    font-weight:700;
  }

  .tagline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.15rem, 2.2vw, 1.5rem);
    color:var(--paper-dim);
    max-width:34ch;
    margin:0 0 2.8rem;
    line-height:1.5;
  }

  .beta-cta{
    font-family:'Cinzel',serif;
    font-style:normal;
    font-weight:600;
    letter-spacing:.02em;
    font-size:clamp(1rem, 1.8vw, 1.25rem);
    color:var(--flag);
    max-width:32ch;
    margin:0 0 2.5rem;
    line-height:1.5;
  }

  form.capture{
    display:flex;
    flex-direction:column;
    gap:1.35rem;
    width:100%;
    max-width:400px;
    text-align:left;
  }
  .form-field{
    display:flex;
    flex-direction:column;
    gap:.5rem;
  }
  .form-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:.5em;
  }
  .form-field label svg{
    width:12px;
    height:12px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
  }
  .form-field input,
  .form-field select{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:1rem;
    padding:.45em 0 .6em;
    outline:none;
    border-radius:0;
    transition:border-color .2s ease;
  }
  .form-field input::placeholder{ color:#57595e; }
  .form-field input:focus,
  .form-field select:focus{ border-bottom-color:var(--flag); }
  .form-field select{
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    color:var(--paper-dim);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%235a5c61' d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right center;
    background-size:13px;
  }
  .form-field select:valid{ color:var(--paper); }
  .form-field select option{ background:var(--graphite); color:var(--paper); }

  .submit-btn{
    background:var(--flag);
    color:#100603;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:.95em 1.4em;
    border-radius:3px;
    cursor:pointer;
    transition:filter .15s ease;
    margin-top:.2rem;
  }
  .submit-btn:hover{ filter:brightness(1.12); }

  .status{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    margin-top:.9rem;
    min-height:1.2em;
  }
  .status.ok{ color:#7fd88f; }
  .status.err{ color:var(--flag); }

  footer{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
    padding:0 6vw 5vh;
    text-align:center;
  }
  footer a{
    color:var(--paper-dim);
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.06em;
    display:inline-flex;
    align-items:center;
    gap:.5em;
  }
  footer a svg{
    width:14px;
    height:14px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
  }
  footer a:hover{ color:var(--paper); }
  footer .fine{
    color:#5a5c61;
    font-size:11px;
  }

  @media (prefers-reduced-motion: reduce){
    .field{ animation:none; }
  }

</style>
</head>
<body>

<svg class="topo" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" aria-hidden="true">
  <defs>
    <filter id="topo-contours" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <!-- rolling terrain heightfield: low-frequency base + finer octaves -->
      <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.0022" numOctaves="5" seed="14" stitchTiles="stitch" result="height"/>
      <feColorMatrix in="height" type="matrix"
        values="0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0    0    0   1 0" result="gray"/>
      <!-- slice the heightfield into elevation bands, like contour intervals -->
      <feComponentTransfer in="gray" result="banded">
        <feFuncR type="discrete" tableValues="0 .077 .154 .231 .308 .385 .462 .538 .615 .692 .769 .846 .923 1"/>
        <feFuncG type="discrete" tableValues="0 .077 .154 .231 .308 .385 .462 .538 .615 .692 .769 .846 .923 1"/>
        <feFuncB type="discrete" tableValues="0 .077 .154 .231 .308 .385 .462 .538 .615 .692 .769 .846 .923 1"/>
      </feComponentTransfer>
      <!-- trace the boundaries between bands -> contour lines -->
      <feConvolveMatrix in="banded" order="3" kernelMatrix="0 1 0 1 -4 1 0 1 0" divisor="1" bias="0" preserveAlpha="true" result="edges"/>
      <!-- recolor the traced lines to the UI's line color -->
      <feColorMatrix in="edges" type="matrix"
        values="0 0 0 0 0.2
                0 0 0 0 0.208
                0 0 0 0 0.227
                2 2 2 0 0"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1440" height="900" filter="url(#topo-contours)"/>
</svg>
<div class="field" aria-hidden="true"></div>

<main class="wrap">
  <p class="eyebrow">Engineered · Not Copied</p>

  <svg class="mark" viewBox="0 0 3865.5 3865.5" role="img" aria-label="Rude Boy Racing monogram">
    <path transform="translate(1188.0 2679.2) scale(1 -1)" fill-rule="evenodd" d="M-114.5 542.2 L-141.7 540.1 L-166.5 535.9 L-188.9 529.7 L-213.5 519.2 L-234.6 505.8 L-250.3 492.0 L-266.1 474.0 L-282.0 452.0 L-293.9 432.7 L-305.8 411.2 L-325.2 370.1 L-490.4 -22.5 L-950.6 -22.5 L-752.8 444.8 L-729.3 495.5 L-710.2 532.0 L-690.8 565.1 L-671.1 594.6 L-651.0 620.6 L-635.6 637.8 L-614.0 658.4 L-597.0 672.1 L-573.2 688.1 L-554.2 698.5 L-587.1 713.5 L-608.4 724.7 L-638.4 742.9 L-657.3 756.0 L-683.8 777.1 L-700.2 792.1 L-723.0 816.1 L-737.0 833.0 L-749.9 850.8 L-761.8 869.3 L-772.7 888.5 L-787.1 918.8 L-795.4 939.9 L-806.0 972.8 L-811.8 995.7 L-818.5 1031.2 L-823.1 1068.3 L-825.1 1099.3 L-825.6 1134.6 L-824.0 1168.5 L-820.2 1200.9 L-814.3 1231.8 L-806.3 1261.2 L-801.4 1275.3 L-790.0 1302.3 L-776.5 1327.7 L-760.7 1351.4 L-752.0 1362.7 L-742.7 1373.5 L-722.6 1393.8 L-700.4 1412.3 L-676.0 1429.1 L-649.4 1444.3 L-605.3 1464.3 L-573.2 1475.8 L-520.9 1490.2 L-483.2 1498.0 L-422.7 1506.9 L-379.5 1511.1 L-310.7 1514.8 L-262.1 1515.5 L1830.2 1515.3 L1895.7 1512.7 L1936.9 1509.2 L1994.7 1501.3 L2030.7 1494.3 L2064.6 1485.8 L2096.5 1475.8 L2140.5 1458.1 L2167.2 1444.3 L2191.9 1429.1 L2214.5 1412.3 L2225.0 1403.2 L2244.6 1383.8 L2253.7 1373.5 L2270.3 1351.4 L2277.8 1339.8 L2284.8 1327.7 L2297.3 1302.3 L2307.8 1275.3 L2316.2 1246.7 L2322.5 1216.6 L2328.3 1168.5 L2329.5 1117.1 L2326.9 1068.3 L2320.6 1019.2 L2313.4 984.2 L2300.6 939.9 L2288.5 908.5 L2269.0 869.3 L2251.9 841.8 L2232.6 816.1 L2218.7 799.9 L2203.8 784.5 L2179.7 762.8 L2144.5 736.6 L2115.8 719.0 L2075.1 698.5 L2092.7 688.1 L2114.8 672.1 L2130.5 658.4 L2150.4 637.8 L2164.7 620.6 L2183.3 594.6 L2201.5 565.1 L2219.3 532.0 L2236.9 495.5 L2258.5 444.8 L2440.2 -22.5 L2012.2 -22.5 L1860.5 370.1 L1839.0 418.6 L1817.1 457.9 L1802.4 478.9 L1787.8 495.8 L1773.2 508.7 L1753.0 521.5 L1729.5 531.4 L1708.1 537.1 L1678.3 541.4 L1651.7 542.5 L1571.4 542.5 L1531.9 -22.5 L26.1 -22.5 L-13.4 542.5ZM-207.9 1191.4 L-235.2 1190.3 L-267.7 1186.9 L-289   </svg>

  <h1 class="word">Rudeboy <span class="accent">Racing</span></h1>

  <p class="tagline">Take a risk or be doomed in the bleachers.</p>

  <p class="beta-cta">Sign up to be a beta test for our F8x Front Aero Kit below</p>

  <form class="capture" id="capture-form">
    <div class="form-field">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Jordan Smith" required autocomplete="name">
    </div>

    <div class="form-field">
      <label for="vehicle">Vehicle</label>
      <select id="vehicle" name="vehicle" required>
        <option value="" disabled selected>Select your vehicle</option>
        <option value="F80 M3">F80 M3</option>
        <option value="F82 M4 Coupe">F82 M4 Coupe</option>
      </select>
    </div>

    <div class="form-field">
      <label for="instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
        </svg>
        Instagram Handle
      </label>
      <input type="text" id="instagram" name="instagram" placeholder="@yourhandle (optional)" autocomplete="off">
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email">
    </div>

    <button type="submit" class="submit-btn">Sign Up</button>
  </form>
  <p class="status" id="form-status" role="status"></p>
</main>

<footer>
  <a href="https://instagram.com/rudeboy.racing" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
      <circle cx="12" cy="12" r="4.5"/>
      <circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none"/>
    </svg>
    @rudeboy.racing
  </a>
  <span class="fine">© <span id="year"></span> Rudeboy Racing. All rights reserved.</span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // ---- EMAIL CAPTURE ----
  // Swap FORM_ENDPOINT below for your free Formspree endpoint
  // (create one at formspree.io — no subscription required on the free tier).
  // Until then, submissions are only logged to the browser console so you
  // can wire this up whenever you're ready.
  const FORM_ENDPOINT = "https://formspree.io/f/mgavprdg";

  const form = document.getElementById('capture-form');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    if (!FORM_ENDPOINT) {
      console.log('[RBR email capture — no endpoint configured yet]', email);
      status.textContent = 'Signup form not yet connected — see setup notes.';
      status.className = 'status err';
      return;
    }

    status.textContent = 'Submitting…';
    status.className = 'status';

    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: new FormData(form)
      });
      if (res.ok) {
        status.textContent = "You're on the list. We'll be in touch.";
        status.className = 'status ok';
        form.reset();
      } else {
        status.textContent = 'Something went wrong — try again shortly.';
        status.className = 'status err';
      }
    } catch (err) {
      status.textContent = 'Network error — try again shortly.';
      status.className = 'status err';
    }
  });
</script>

</body>
</html>
